<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by Honey. Do not edit this generated copy directly. -->
<fontconfig>
  <description>Honey user typography profile - Quartz 1:1 Parity</description>

  <!-- Global rasterization rules matching Quartz Compositor architecture -->
  <match target="font">
    <!-- Rule 1: Universal Grayscale Antialiasing (macOS Mojave+ R=G=B standard) -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>none</const>
    </edit>

    <!-- Rule 2: Anti-Hinting (Vector Outline Preservation) -->
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>

    <!-- Rule 3: Stem Darkening / Optical Font Dilation (+14% to +16% energy compensation) -->
    <edit name="stemdarkening" mode="assign">
      <bool>true</bool>
    </edit>

    <!-- Embedded bitmaps: keep enabled for color emoji fonts, disable for outline text -->
    <edit name="embeddedbitmap" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- Prevent bitmap fonts from replacing vector typography for small sizes -->
  <match target="font">
    <test name="outline" compare="eq">
      <bool>false</bool>
    </test>
    <test name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test name="family" compare="not_eq">
      <string>Twitter Color Emoji</string>
    </test>
    <test name="family" compare="not_eq">
      <string>JoyPixels</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Font fallback hierarchy -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>SF Pro Display</family>
      <family>SF Pro Text</family>
      <family>Noto Sans</family>
      <family>Cantarell</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>SF Pro Text</family>
      <family>Noto Sans</family>
      <family>Cantarell</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>New York</family>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>SF Mono</family>
      <family>Menlo</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
      <family>Twitter Color Emoji</family>
      <family>JoyPixels</family>
    </prefer>
  </alias>
</fontconfig>
